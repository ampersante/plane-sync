name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Offline smoke gate
        run: bash scripts/smoke_offline.sh

      - name: Install test (curl installer against local tarball)
        run: |
          set -euo pipefail
          git archive --prefix=plane-sync-ci/ -o "$RUNNER_TEMP/t.tgz" HEAD
          export HOME="$(mktemp -d)"
          PLANE_SYNC_TARBALL="$RUNNER_TEMP/t.tgz" bash install.sh
          test "$("$HOME/.local/bin/plane-sync" --version)" = "plane-sync $(python3 -c 'import plane_api;print(plane_api.__version__)')"
          bash install.sh --uninstall
          if [[ -e "$HOME/.local/share/plane-sync" || -e "$HOME/.local/bin/plane-sync" ]]; then
            echo "uninstall did not remove expected paths" >&2
            exit 1
          fi
